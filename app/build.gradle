// Modified for MambaPad (2026), based on KeysJoy. See LICENSE.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def signingEnvironment = ['MAMBAPAD_KEYSTORE_PATH', 'MAMBAPAD_STORE_PASSWORD',
                          'MAMBAPAD_KEY_ALIAS', 'MAMBAPAD_KEY_PASSWORD']
def suppliedSigning = signingEnvironment.collect { System.getenv(it) }
if ((suppliedSigning.any { it } || System.getenv('MAMBAPAD_REQUIRE_SIGNING') == 'true') &&
        !suppliedSigning.every { it }) {
    throw new GradleException('All MAMBAPAD signing environment variables are required')
}

android {
    namespace 'com.github.ifeel.keysjoy'
    compileSdk 35

    defaultConfig {
        applicationId "com.github.ifeel.keysjoy.usb"
        minSdk 28
        targetSdk 35
        versionCode 11
        versionName "1.3.1"
        testInstrumentationRunner "com.github.ifeel.keysjoy.UsbSmokeInstrumentation"
        multiDexEnabled true
        multiDexKeepProguard rootProject.file('multidex-keep.pro')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    signingConfigs {
        debug {
            if (suppliedSigning.every { it }) {
                storeFile file(suppliedSigning[0])
                storePassword suppliedSigning[1]
                keyAlias suppliedSigning[2]
                keyPassword suppliedSigning[3]
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.13.1'
}
